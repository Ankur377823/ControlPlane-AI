services:
  - type: web
    name: controlplane-ai
    env: python
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: botpress-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_DIST
        value: ./frontend/dist
      - key: BOTPRESS_CONNECTOR_DB
        value: /app/data/botpress_connector.db
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
