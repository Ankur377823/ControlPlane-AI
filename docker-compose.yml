# ControlPlane AI — Multi-Container / Production Composition
# Usage:
#   docker compose up --build --watch
#   open http://localhost:8000/

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - BOTPRESS_CONNECTOR_DB=/app/data/botpress_connector.db
      - FRONTEND_DIST=/app/frontend/dist
      - DATABASE_URL=${DATABASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - GUARDIAN_REQUIRE_AUTH=${GUARDIAN_REQUIRE_AUTH:-true}
      - TASK_TOKEN_SECRET=${TASK_TOKEN_SECRET:-}
    volumes:
      - botpress-data:/app/data
    develop:
      watch:
        - action: rebuild
          path: ./frontend
        - action: rebuild
          path: ./backend
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  botpress-data:
